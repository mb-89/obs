# se-workflows: .github/actions/suite-time/action.yml at d619f061d99d6c51ace0b2cae73e1c542ca2cc8b from ${{ github.repository_owner }}/SE
# Generated by SE from its file of that path at that commit; do not edit: se_workflows.py write regenerates it (SE's README "Workflows").
# The check job's step of a sharded suite (README "Test budget"): collects the records the
# suite-shard action uploaded and runs work_tickets.py suite-time, which prints CI's suite time,
# the slowest shard's, as the notice SE reads, and holds it to se.toml's [tests] budget.
# SE's scripts run from this action's own checkout; a project's copy (scripts/se_workflows.py,
# README "Workflows") checks out SE at the project's pin and runs them there.
name: se suite time
description: Judge a sharded suite's time, its slowest shard's, against the project's budget.
inputs:
  shards:
    description: How many shards ran; fewer or more records fail the step.
    required: true
  worktree:
    description: The project's checkout, holding se.toml.
    default: .
runs:
  using: composite
  steps:
    - name: SE at the project's pin
      uses: actions/checkout@v7
      with:
        repository: ${{ github.repository_owner }}/SE
        ref: d619f061d99d6c51ace0b2cae73e1c542ca2cc8b
        path: .se/ci/se
    - name: Download the shards' records
      uses: actions/download-artifact@v8
      with:
        pattern: se-suite-shard-*
        merge-multiple: true
        path: ${{ runner.temp }}/se-suite-shards
    - name: The sharded suite, within its budget
      shell: bash
      env:
        PYTHONUNBUFFERED: "1" # its output in the order it was written
        SHARDS: ${{ inputs.shards }}
        WORKTREE: ${{ inputs.worktree }}
      run: >-
        python3 "$GITHUB_WORKSPACE/.se/ci/se/scripts/work_tickets.py" suite-time
        --worktree "$WORKTREE" --shards "$RUNNER_TEMP/se-suite-shards" --expect "$SHARDS"
