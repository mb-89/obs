# se-workflows: .github/actions/suite-shard/action.yml at 148f00e67586ac2e40d9a74f42a269999734f1b3 from ${{ github.repository_owner }}/SE
# Generated by SE from its file of that path at that commit; do not edit: se_workflows.py write regenerates it (SE's README "Workflows").
# One shard of a sharded suite (README "Test budget"): runs the shard's command, times it with
# work_tickets.py suite-shard and uploads its record for the check job's suite-time action.
# SE's scripts run from this action's own checkout; a project's copy (scripts/se_workflows.py,
# README "Workflows") checks out SE at the project's pin and runs them there.
name: se suite shard
description: Run and time one shard of the project's suite and upload its record.
inputs:
  name:
    description: The shard's name, unique among the shards (letters, digits, '.', '_', '-').
    required: true
  command:
    description: The shard's command, a bash command line run from the worktree.
    required: true
  worktree:
    description: The project's checkout.
    default: .
runs:
  using: composite
  steps:
    - name: SE at the project's pin
      uses: actions/checkout@v7
      with:
        repository: ${{ github.repository_owner }}/SE
        ref: 148f00e67586ac2e40d9a74f42a269999734f1b3
        path: .se/ci/se
    - name: Run and time the shard
      shell: bash
      env:
        PYTHONUNBUFFERED: "1" # its output in the order it was written
        NAME: ${{ inputs.name }}
        COMMAND: ${{ inputs.command }}
        WORKTREE: ${{ inputs.worktree }}
      run: >-
        python3 "$GITHUB_WORKSPACE/.se/ci/se/scripts/work_tickets.py" suite-shard
        --worktree "$WORKTREE" --name "$NAME" --record "$RUNNER_TEMP/se-suite-shards"
        -- bash -c "$COMMAND"
    # Also after a failed shard: suite-time refuses its exit code and names it.
    - name: Upload the shard's record
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: se-suite-shard-${{ inputs.name }}
        path: ${{ runner.temp }}/se-suite-shards/${{ inputs.name }}.json
        if-no-files-found: error
