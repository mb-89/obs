[project]
authored_content = [
  "spec/design_input/**/*.md",
  "spec/capabilities/**/*.md",
  "README.md",
  "AGENTS.md",
  "adapters/html/README.md",
  "adapters/html/AGENTS.md",
]
identity = "mb <mb>"
public_check = true
version = "1.0.0"

[tests]
# The complete suite, its setup and its time budget; test/suite.py's docstring says what each runs.
setup = ["uv", "run", "python", "test/suite.py", "--setup"]
command = ["uv", "run", "python", "test/suite.py", "--durations=10"]
target_seconds = 60
limit_seconds = 120

[modules.se]
url = "https://github.com/mb-89/SE.git"
ref = "6517b8e90f674bacb98fe916a6c54fd8ff353e5c"
