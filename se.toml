[project]
authored_content = [
  "spec/design_input/**/*.md",
  "spec/capabilities/**/*.md",
  "README.md",
  "AGENTS.md",
  "adapters/html/README.md",
  "adapters/html/AGENTS.md",
]
identity = "mb <mb>"

[tests]
# The complete suite and its time budget; test/suite.py's docstring says what the suite runs.
command = ["uv", "run", "python", "test/suite.py", "--durations=10"]
target_seconds = 60
limit_seconds = 120
