[project]
name = "obs-html"
version = "0.1.0"
description = "Render a JSON Document as portable HTML or PDF."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "jsonschema>=4.26.0",
    "markdown-it-py>=3.0",
    "playwright>=1.64.0",
    "pypdf>=6.21.2",
]

[project.scripts]
obs-html = "obs_html.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obs_html"]

[tool.pytest.ini_options]
testpaths = ["test"]
markers = [
    "dom: runs the embedded report runtime in Node (needs `npm --prefix test/browser ci`).",
    "browser: opens a real Chromium through Playwright.",
]
