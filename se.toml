[project]
authored_content = [
  "spec/design_input/**/*.md",
  "spec/capabilities/**/*.md",
  "README.md",
  "AGENTS.md",
  "adapters/html/README.md",
  "adapters/html/AGENTS.md",
]
identity = "mb <mb>"
public_check = true
release = "workflow"
version = "3.22.0"

# How a landing reaches main: se's README "Landing on main" owns the setting.
[integrate]
landing = "fast-forward"

[tests]
# The complete suite, its setup and its time budget; test/suite.py's docstring says what each runs.
setup = ["uv", "run", "python", "test/suite.py", "--setup"]
command = ["uv", "run", "python", "test/suite.py", "--durations=10"]
target_seconds = 100
limit_seconds = 120
# Host variance: spec/design_input/quality.md, Testing boundaries, says why.
over_limit = "warn"
# The shards CI runs the suite in: .github/workflows/test.yml, `check`'s suite-time `shards: 2`.
# The target and the limit are each shard's; a whole-suite run is judged against twice each.
shards = 2

[modules.se]
url = "../SE.git"
version = "^5.0"
