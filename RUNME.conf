# obs's declaration for se's generic RUNME: what obs needs on a machine with only its package
# manager, and obs's command line. The header of RUNME.sh owns the format.
path ~/.local/bin
need git command git
get git winget Git.Git
get git apt git
get git dnf git
get git brew git
need curl command curl
get curl apt curl
get curl dnf curl
need uv command uv
get uv unix curl -LsSf https://astral.sh/uv/install.sh | sh
get uv windows powershell -NoProfile -ExecutionPolicy Bypass -Command "irm https://astral.sh/uv/install.ps1 | iex"
need npm command npm
get npm winget OpenJS.NodeJS.LTS
get npm apt npm
get npm dnf nodejs npm
get npm brew node
run uv run --project "$RUNME_ROOT" obs-document
