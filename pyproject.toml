[project]
name = "obs-html"
version = "0.1.0"
description = "Portable HTML document output adapter."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "jsonschema>=4.0",
    "PyYAML>=6.0",
]

[project.scripts]
obs-html-smoke = "obs_html.smoke:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obs_html"]

[tool.pytest.ini_options]
testpaths = ["test"]
