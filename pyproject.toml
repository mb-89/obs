[project]
name = "obs"
version = "0.2.3"
description = "Generate portable HTML documents from Obsidian-compatible Markdown vaults."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "jsonschema>=4.26.0",
    "latex2mathml>=3.81.1",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "pint>=0.25.3",
    "playwright>=1.64.0",
    "pypdf>=6.21.2",
    "pyyaml>=6.0.3",
    "sympy>=1.14.0",
]

[project.urls]
# The public repository a source archive's reproduce.py installs obs from (architecture.md, Source archive).
Repository = "https://github.com/mb-89/obs"

[project.scripts]
obs-html-interim = "obs_html_interim.cli:main"
obs-document = "obs.document:main"

[dependency-groups]
dev = [
    "filelock>=4.2.9",
    "obs-html",
    "pytest>=8.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
# Build the core again when what hatch_build.py generates from changes.
cache-keys = [{ file = "pyproject.toml" }, { file = "hatch_build.py" }, { file = "spec/capabilities/**" },
              { file = "src/obs/capabilities.py" }, { file = "src/obs/diagrams/package-lock.json" },
              { file = "src/obs/diagram.py" }]

[tool.uv.workspace]
members = ["adapters/html"]

[tool.uv.sources]
obs-html = { workspace = true }

[build-system]
# pyyaml: hatch_build.py writes the packaged capability reference from the capability notes.
requires = ["hatchling", "pyyaml"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obs_html_interim", "src/obs"]

[tool.hatch.build.targets.wheel.hooks.custom]
# hatch_build.py: the packaged capability reference, src/obs/capability-reference.json, and the
# diagram renderers, src/obs/vendor/diagrams.

[tool.hatch.build]
directory = "data/data_output/dist"

[tool.pytest.ini_options]
testpaths = ["test"]
# Tiers are assigned in test/conftest.py. A bare `pytest` runs unit and dom; naming files
# runs every tier in them; `pytest --gate` runs everything except external.
markers = [
    "unit: in-process Python checks",
    "dom: Node.js + linkedom DOM contract checks",
    "browser: native Chrome via Playwright (needs OBS_HTML_TEST_NATIVE_BROWSER)",
    "e2e: external integration, reproduction, PowerShell, or real browser pickers",
    "external: needs data outside both repositories; runs only when selected with -m external",
]

[tool.obs-html.vendor]
js-yaml = "4.1.1"
pdf-lib = "1.17.1"
plotly-basic = "2.35.3"
